# ---------------------------------------------------------------
#  producer.properties - used with  --command-config /lab/config/producer.properties
# ---------------------------------------------------------------
# who am I (shows up in broker logs and metrics)
client.id=lab-producer

# durability: wait until all in-sync replicas have the record
acks=all
# no duplicates on retry (default since Kafka 3.0, shown here to be explicit)
enable.idempotence=true

# throughput: wait up to 20 ms to fill a batch of up to 32 KB, then compress it
linger.ms=20
batch.size=32768
# NOTE: kafka-console-producer ignores this line - its own --compression-codec
# option (default: none) wins. Real applications honour it.
compression.type=lz4

# how long send() may take in total, including retries
delivery.timeout.ms=120000
