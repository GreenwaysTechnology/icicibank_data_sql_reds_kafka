# ---------------------------------------------------------------
#  connect2.properties - Kafka Connect worker 2 (distributed mode)
# ---------------------------------------------------------------

# the cluster - internal listener names, Connect runs on the Docker network
bootstrap.servers=kafka1:9092,kafka2:9092,kafka3:9092

# workers with the same group.id form one Connect cluster
group.id=connect-lab

# where the Connect cluster keeps its state - three compacted internal topics
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status
config.storage.replication.factor=3
offset.storage.replication.factor=3
status.storage.replication.factor=3

# default converters - a connector can override them
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# save source offsets every 10 s (default 60 s) - quicker to watch in a lab
offset.flush.interval.ms=10000

# lab only: when a worker leaves, wait at most 30 s (default 5 min) before its
# connectors and tasks are given to the other workers
scheduled.rebalance.max.delay.ms=30000

# REST API
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect2
rest.advertised.port=8083

# where connector plugins are: the FileStream connectors ship in Kafka's libs,
# anything else (the JDBC connector, Lab 5) goes in /plugins
plugin.path=/opt/kafka/libs/connect-file-4.3.1.jar,/plugins
