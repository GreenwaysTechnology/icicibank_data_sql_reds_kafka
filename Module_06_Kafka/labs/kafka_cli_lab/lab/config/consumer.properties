# ---------------------------------------------------------------
#  consumer.properties - used with  --command-config /lab/config/consumer.properties
# ---------------------------------------------------------------
client.id=lab-consumer
group.id=orders-reporting

# where to start when the group has NO committed offset yet: earliest | latest | none
auto.offset.reset=earliest

# commit offsets automatically every 5 s (the default behaviour)
enable.auto.commit=true
auto.commit.interval.ms=5000

# at most 100 records returned by one poll()
max.poll.records=100

# only read committed data from transactional producers
isolation.level=read_committed
