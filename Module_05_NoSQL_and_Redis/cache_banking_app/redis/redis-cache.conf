# ---------------------------------------------------------------------------
# redis-cache.conf - Redis configured as a pure CACHE (not a database)
# Mounted read-only into the redis container by docker-compose.yml.
# Every directive below is explained in Redis_Caching_Guide.pdf, section 2.
# (redis.conf does not allow a comment on the same line as a directive.)
# ---------------------------------------------------------------------------

# --- network -----------------------------------------------------------------
bind 0.0.0.0
port 6379
# acceptable only because the port sits on a private Docker network
protected-mode no
tcp-keepalive 300
# never close idle client connections (the API keeps one open)
timeout 0

# --- memory: the two settings that make Redis a cache --------------------------
# hard ceiling for the dataset
maxmemory 64mb
# when full, evict the least-recently-used key - ANY key, with or without a TTL.
# Right for a cache, where every key can be rebuilt from PostgreSQL.
maxmemory-policy allkeys-lru
# LRU is approximated by sampling N keys; 10 is closer to true LRU, a bit more CPU
maxmemory-samples 5

# --- expiry & eviction work off the main thread -------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
# makes DEL behave like UNLINK
lazyfree-lazy-user-del yes
# background tasks (including active expiry) run 10 times per second
hz 10

# --- persistence: OFF - a cache can always be rebuilt from the database -------
save ""
appendonly no

# --- observability -------------------------------------------------------------
loglevel notice
# empty = log to stdout, so `docker logs bank-redis` shows it
logfile ""
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
