# ==========================================================================
# redis-persistence.conf
# ICICI Bank Learning Academy · Module 07 · NoSQL & Redis
#
# A redis.conf tuned for durability and meant to run INSIDE a container.
# Mount it read-only and point --dir at a volume:
#
#   docker run -d --name icici-redis \
#     -p 6379:6379 \
#     -v icici_redis_data:/data \
#     -v "$(pwd)/redis-persistence.conf:/usr/local/etc/redis/redis.conf:ro" \
#     redis:7-alpine redis-server /usr/local/etc/redis/redis.conf
#
# Every value here was exercised against redis:7-alpine on this machine
# on 2026-09-23 - see persistence_docker/README.md for the transcripts.
# ==========================================================================

################################ NETWORK #####################################

# Inside its own container Redis is already isolated by Docker's network
# namespace, so bind to all interfaces INSIDE the container and let the
# -p flag (or a docker-compose "ports:" entry) control what is reachable
# from the host. Do not do this on a server with no container boundary.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

################################# GENERAL ####################################

# Never daemonize in a container: Docker expects PID 1 to be the process it
# is supervising. daemonize yes forks into the background, Docker sees PID 1
# exit immediately, and the container stops right after it started.
daemonize no
supervised no
pidfile ""
loglevel notice
# Log to stdout so `docker logs` captures it - a logfile path would be
# writing into the container's throwaway layer instead.
logfile ""
databases 16

# A password is mandatory the moment the port is published beyond the
# container's own network. Override at `docker run` time with
# --requirepass "$REDIS_PASSWORD" or the REDIS_PASSWORD env var in compose;
# never bake a real password into this file if it goes into version control.
requirepass CHANGE_ME_ICICI_TRAINING_ONLY

############################## SNAPSHOTTING (RDB) #############################

# Point-in-time snapshots, written to dump.rdb under `dir` below.
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
sanitize-dump-payload no
dbfilename dump.rdb

# MUST be a path inside the container that a volume is mounted on, or the
# RDB and AOF files live in the container's writable layer and vanish the
# moment the container is removed - see Lab P.1 for the measured proof.
dir /data

############################# APPEND ONLY FILE (AOF) ##########################

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# always  = fsync every write, safest, slowest
# everysec = fsync once a second, at most 1s of loss on a container kill - SUOK for most banking workloads
# no      = let the OS decide, fastest, largest loss window
appendfsync everysec

no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Redis 7's hybrid persistence: BGREWRITEAOF writes the base file in RDB
# format (compact, fast to load) and only the tail is a plain command log.
aof-use-rdb-preamble yes

aof-timestamp-enabled no

################################ MEMORY ######################################

# Set to a fraction of the container's memory LIMIT (docker run -m / compose
# mem_limit), not the host's total RAM - the two are rarely the same number.
maxmemory 512mb
maxmemory-policy noeviction

############################### SECURITY #####################################

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""

################################ ADVANCED #####################################

# Multi Part AOF (Redis 7) rewrites incrementally instead of doing the whole
# thing inline; this cap only matters if you fall back to the legacy single
# file, kept here for completeness.
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
